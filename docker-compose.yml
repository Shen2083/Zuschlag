# Local development infrastructure for Zuschlag.ai.
#
#   cp .env.example .env && docker compose up -d --wait
#
# Every port is bound to 127.0.0.1 only. Credentials come from .env (never
# committed). `docker compose --profile app up` also builds and runs api + web.

name: zuschlag

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      TZ: UTC
      PGTZ: UTC
      # consumed by infra/postgres/init/01-roles.sh
      ZUSCHLAG_DB_NAME: ${ZUSCHLAG_DB_NAME:-zuschlag}
      ZUSCHLAG_MIGRATOR_PASSWORD: ${ZUSCHLAG_MIGRATOR_PASSWORD:?set in .env}
      ZUSCHLAG_APP_PASSWORD: ${ZUSCHLAG_APP_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${ZUSCHLAG_DB_NAME:-zuschlag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --appendonly
      - "yes"
      - --protected-mode
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # S3-compatible object storage for RFQ attachments (mock for AWS S3 eu-central-1).
  # MinIO stopped publishing community images in 2025; this is a source build
  # of the final upstream release.
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set in .env}
      MINIO_REGION: ${S3_REGION:-eu-central-1}
      MINIO_BROWSER_REDIRECT: "false"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # The image ships no curl, wget or grep: probe the health endpoint with bash builtins.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the private, versioned RFQ bucket in eu-central-1.
  minio-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-eu-central-1}
      BUCKET: ${S3_BUCKET:-zuschlag-rfq-attachments}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        EP=http://minio:9000
        aws --endpoint-url $$EP s3api head-bucket --bucket $$BUCKET 2>/dev/null || \
          aws --endpoint-url $$EP s3api create-bucket --bucket $$BUCKET \
            --create-bucket-configuration LocationConstraint=$$AWS_DEFAULT_REGION
        aws --endpoint-url $$EP s3api put-bucket-versioning --bucket $$BUCKET \
          --versioning-configuration Status=Enabled
        echo "bucket $$BUCKET ready"
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zuschlag_app:${ZUSCHLAG_APP_PASSWORD}@postgres:5432/${ZUSCHLAG_DB_NAME:-zuschlag}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://zuschlag_migrator:${ZUSCHLAG_MIGRATOR_PASSWORD}@postgres:5432/${ZUSCHLAG_DB_NAME:-zuschlag}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      ZUSCHLAG_AUTH_MODE: ${AUTH_MODE:-dev_headers}
      ZUSCHLAG_ENVIRONMENT: ${ENVIRONMENT:-development}
      DEV_TENANT_ID: ${DEV_TENANT_ID:-}
      DEV_ACTOR_ID: ${DEV_ACTOR_ID:-dev-user}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
