[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC
# The database URL is read from MIGRATIONS_DATABASE_URL in alembic/env.py,
# never from this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
