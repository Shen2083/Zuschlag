[project]
name = "zuschlag-api"
version = "0.1.0"
description = "Zuschlag.ai API: RFQ ingestion, SAP master-data matching and quote generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
    "xmlschema>=3.4",
]

[project.optional-dependencies]
llm = [
    "anthropic[bedrock]>=1.15.0",
]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

# CPU-only PyTorch on Linux (the API image has no GPU); macOS wheels come from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zuschlag_api"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-defusedxml>=0.7.0.20260504",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "ASYNC", "C4", "SIM", "RUF", "DTZ", "PT", "TID"]
ignore = [
  "S101",   # assert is fine in tests (scoped below would be nicer, but alembic env uses it too)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/versions/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Use datetime.now(UTC)."

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "alembic"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs a PostgreSQL 16 + pgvector database (TEST_DATABASE_URL)",
  "live_llm: calls the configured LLM (RUN_LIVE_LLM=1)",
]
addopts = "-ra --strict-markers"
